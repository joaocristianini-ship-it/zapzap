<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Web</title>
    <!-- Ícones FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b141a;
            color: #e9edef;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* --- ESTILO FLUIDO DE AUTENTICAÇÃO (SEM CAIXAS/QUADRADOS) --- */
        .auth-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #111b21 0%, #0b141a 100%);
            padding: 2rem;
            animation: fadeIn 0.4s ease-out;
        }

        .auth-screen.active {
            display: flex;
        }

        .auth-content {
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo-wrapper {
            width: 80px;
            height: 80px;
            background: rgba(0, 168, 132, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        .logo-icon {
            font-size: 2.8rem;
            color: #00a884;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .auth-header h2 {
            font-size: 1.6rem;
            font-weight: 400;
            letter-spacing: -0.5px;
            margin-bottom: 0.6rem;
            color: #f1f5f9;
        }

        .auth-header p {
            font-size: 0.9rem;
            color: #8696a0;
            line-height: 1.4;
        }

        form {
            width: 100%;
        }

        /* Inputs em formato de linha/minimalista */
        .input-wrapper {
            position: relative;
            margin-bottom: 2rem;
            width: 100%;
        }

        .input-wrapper input {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 2px solid #2a3942;
            padding: 0.8rem 0;
            color: #e9edef;
            font-size: 1.1rem;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .input-wrapper input:focus {
            border-bottom-color: #00a884;
        }

        .input-wrapper input::placeholder {
            color: #54656f;
            font-size: 0.95rem;
        }

        /* Botão Fluído */
        .btn-fluid {
            width: 100%;
            background: #00a884;
            color: #111b21;
            border: none;
            padding: 1rem;
            border-radius: 24px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0, 168, 132, 0.2);
        }

        .btn-fluid:hover {
            background: #06cf9c;
            transform: translateY(-1px);
        }

        .btn-back-link {
            background: none;
            border: none;
            color: #8696a0;
            cursor: pointer;
            font-size: 0.85rem;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            align-self: flex-start;
            transition: color 0.2s;
        }

        .btn-back-link:hover {
            color: #00a884;
        }

        /* --- TELA 3: CHAT FULLSCREEN --- */
        .chat-screen {
            display: none;
            width: 100%;
            height: 100%;
            animation: fadeIn 0.3s ease-out;
        }

        .chat-screen.active {
            display: flex;
        }

        /* Sidebar Esquerda */
        .sidebar {
            width: 320px;
            background: #111b21;
            border-right: 1px solid rgba(134, 150, 160, 0.15);
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 1.2rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #111b21;
        }

        .user-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #202c33;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #00a884;
            font-size: 1.1rem;
        }

        .header-actions button {
            background: none;
            border: none;
            color: #8696a0;
            font-size: 1.1rem;
            cursor: pointer;
            transition: color 0.2s;
        }

        .header-actions button:hover {
            color: #ef4444;
        }

        .chat-list {
            flex: 1;
            padding: 0.5rem;
        }

        .chat-item {
            display: flex;
            align-items: center;
            padding: 0.9rem 1rem;
            gap: 1rem;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .chat-item.active, .chat-item:hover {
            background: #202c33;
        }

        .chat-item .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(0, 168, 132, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #00a884;
            font-size: 1.1rem;
        }

        .chat-info h3 {
            font-size: 0.95rem;
            font-weight: 500;
        }

        .chat-info p {
            font-size: 0.8rem;
            color: #8696a0;
            margin-top: 2px;
        }

        /* Painel Principal */
        .chat-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #0b141a;
        }

        .chat-header {
            padding: 1.2rem 1.8rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            background: #111b21;
            border-bottom: 1px solid rgba(134, 150, 160, 0.15);
        }

        .chat-header .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #202c33;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #8696a0;
        }

        .chat-title h3 {
            font-size: 1rem;
            font-weight: 500;
        }

        .chat-title span {
            font-size: 0.75rem;
            color: #00a884;
        }

        .messages-body {
            flex: 1;
            padding: 2rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            background-image: radial-gradient(#202c33 1px, transparent 1px);
            background-size: 24px 24px;
        }

        .system-message {
            align-self: center;
            background: rgba(32, 44, 51, 0.6);
            backdrop-filter: blur(4px);
            padding: 0.5rem 1rem;
            border-radius: 16px;
            font-size: 0.75rem;
            color: #8696a0;
            border: 1px solid rgba(134, 150, 160, 0.1);
        }

        .message-bubble {
            max-width: 60%;
            padding: 0.7rem 1rem;
            border-radius: 16px 16px 2px 16px;
            font-size: 0.95rem;
            position: relative;
            word-wrap: break-word;
            line-height: 1.4;
        }

        .message-bubble.sent {
            align-self: flex-end;
            background: #005c4b;
            color: #e9edef;
        }

        .message-bubble .time {
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 4px;
            display: block;
            text-align: right;
        }

        /* Barra Inferior de Envio */
        .chat-footer {
            padding: 1rem 1.5rem;
            background: #111b21;
        }

        .chat-footer form {
            display: flex;
            gap: 0.8rem;
            align-items: center;
        }

        .chat-footer input {
            background: #202c33;
            border: 1px solid transparent;
            padding: 0.85rem 1.2rem;
            border-radius: 24px;
            color: #e9edef;
            outline: none;
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }

        .chat-footer input:focus {
            border-color: rgba(0, 168, 132, 0.4);
        }

        .chat-footer input[type="text"]:first-child {
            width: 220px;
        }

        .chat-footer input[type="text"]:nth-child(2) {
            flex: 1;
        }

        .btn-send {
            background: #00a884;
            border: none;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            color: #111b21;
            cursor: pointer;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            flex-shrink: 0;
        }

        .btn-send:hover {
            background: #06cf9c;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="app-container">

        <!-- TELA 1: TELEFONE -->
        <div id="step-phone" class="auth-screen active">
            <div class="auth-content">
                <div class="logo-wrapper">
                    <i class="fa-brands fa-whatsapp logo-icon"></i>
                </div>
                <div class="auth-header">
                    <h2>Número de Telefone</h2>
                    <p>Informe o seu número para conectar à API RESTful.</p>
                </div>
                <form onsubmit="event.preventDefault(); goToStepSenha();">
                    <div class="input-wrapper">
                        <input type="text" id="loginTelefone" placeholder="Ex: 5518999999999" required autocomplete="off">
                    </div>
                    <button type="submit" class="btn-fluid">
                        Avançar <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </form>
            </div>
        </div>

        <!-- TELA 2: SENHA -->
        <div id="step-password" class="auth-screen">
            <div class="auth-content">
                <button class="btn-back-link" onclick="goToStepPhone()">
                    <i class="fa-solid fa-arrow-left"></i> Alterar telefone
                </button>
                <div class="logo-wrapper">
                    <i class="fa-solid fa-lock logo-icon"></i>
                </div>
                <div class="auth-header">
                    <h2>Sua Senha</h2>
                    <p>Digite a senha cadastrada para prosseguir.</p>
                </div>
                <form onsubmit="event.preventDefault(); realizarLogin();">
                    <div class="input-wrapper">
                        <input type="password" id="loginSenha" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn-fluid">
                        Entrar <i class="fa-solid fa-right-to-bracket"></i>
                    </button>
                </form>
            </div>
        </div>

        <!-- TELA 3: CHAT -->
        <div id="step-chat" class="chat-screen">
            <aside class="sidebar">
                <header class="sidebar-header">
                    <div class="user-avatar">
                        <i class="fa-solid fa-user"></i>
                    </div>
                    <div class="header-actions">
                        <button title="Sair" onclick="fazerLogout()"><i class="fa-solid fa-right-from-bracket"></i></button>
                    </div>
                </header>

                <div class="chat-list">
                    <div class="chat-item active">
                        <div class="avatar">
                            <i class="fa-solid fa-paper-plane"></i>
                        </div>
                        <div class="chat-info">
                            <h3>Enviar Mensagem</h3>
                            <p>Serviço de Mensageria API</p>
                        </div>
                    </div>
                </div>
            </aside>

            <main class="chat-panel">
                <header class="chat-header">
                    <div class="avatar">
                        <i class="fa-solid fa-user-gear"></i>
                    </div>
                    <div class="chat-title">
                        <h3 id="display-user-phone">Nova Mensagem</h3>
                        <span>Conexão Ativa</span>
                    </div>
                </header>

                <div class="messages-body" id="chatArea">
                    <div class="system-message">
                        <span>Integração via Requisições Assíncronas HTTP (Vanilla JS)</span>
                    </div>
                </div>

                <footer class="chat-footer">
                    <form onsubmit="event.preventDefault(); enviarMensagem();">
                        <input type="text" id="destinatario" placeholder="Telefone destino" required autocomplete="off">
                        <input type="text" id="textoMensagem" placeholder="Escreva uma mensagem..." required autocomplete="off">
                        <button type="submit" class="btn-send"><i class="fa-solid fa-paper-plane"></i></button>
                    </form>
                </footer>
            </main>
        </div>

    </div>

<script src="js/script.js"></script>
</body>
</html>
